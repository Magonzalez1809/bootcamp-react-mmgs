<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="weather.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container-app">
      <main>
        <div class="principalnav">
          <a href="weather-home.html"
            ><img src="images/circle-return.svg" alt="cicle-dot"
          /></a>
          <img src="images/detail-week-icon.PNG" alt="logo" />
          <a href=""><img src="images/menu-dot.svg" alt="option-menu" /></a>
        </div>
        <div class="weather-tomorrow">
          <img src="images/rainy-img.png" alt="" />
          <div>
            <p>Tommorrow</p>
            <p>20<span>/17°</span></p>
            <p>Rainy - Cloudy</p>
          </div>
        </div>
        <div class="forecast">
          <div>
            <img src="images/wind.png" alt="wind" />
            <p class="forecast-data">9 km/h</p>
            <p class="forecast-name">Wind</p>
          </div>
          <div>
            <img src="images/raindrop.png" alt="Humidity" />
            <p class="forecast-data">31%</p>
            <p class="forecast-name">Humidity</p>
          </div>
          <div>
            <img src="images/chance-of-rain.png" alt="sun" />
            <p class="forecast-data">93%</p>
            <p class="forecast-name">chance of rain</p>
          </div>
        </div>
      </main>
      <section>
        <div class="forecast-day">
          <p>Mon</p>
          <figure>
            <img src="images/rainy-icon.png" alt="Rainy" />
            <p>Rainy</p>
          </figure>
          <p>+20°<span>+14°</span></p>
        </div>
        <div class="forecast-day">
          <p>Tue</p>
          <figure>
            <img src="images/lite-rainy.png" alt="Rainy" />
            <p>Rainy</p>
          </figure>
          <p>+22°<span>+16°</span></p>
        </div>
        <div class="forecast-day">
          <p>Wed</p>
          <figure>
            <img src="images/storm-icon.png" alt="Storm" />
            <p>Storm</p>
          </figure>
          <p>+19°<span>+13°</span></p>
        </div>
        <div class="forecast-day">
          <p>Thu</p>
          <figure>
            <img src="images/slow.png" alt="Slow" />
            <p>Slow</p>
          </figure>
          <p>+18°<span>+12°</span></p>
        </div>
        <div class="forecast-day">
          <p>Fri</p>
          <figure>
            <img src="images/thunder.png" alt="Thunder" />
            <p>Thunder</p>
          </figure>
          <p>+23°<span>+19°</span></p>
        </div>
        <div class="forecast-day">
          <p>Sat</p>
          <figure>
            <img src="images/rainy-icon.png" alt="Rainy" />
            <p>Rainy</p>
          </figure>
          <p>+25°<span>+17°</span></p>
        </div>
        <div class="forecast-day">
          <p>Sun</p>
          <figure>
            <img src="images/storm-icon.png" alt="Storm" />
            <p>Storm</p>
          </figure>
          <p>+21°<span>+18°</span></p>
        </div>
      </section>
    </div>
  </body>
</html>
