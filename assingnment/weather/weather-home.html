<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="weather.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container-app">
      <main>
        <div class="principalnav">
          <a href=""><img src="images/circle-dot.svg" alt="cicle-dot" /></a>
          <img src="images/logo.png" alt="logo" />
          <a href=""><img src="images/menu-dot.svg" alt="option-menu" /></a>
        </div>
        <a class="updatingButton" href="">Updating</a>
        <div class="weather-info">
          <img src="images/storm.png" alt="storm" />
          <div class="container-temperature">
            <p class="temperature">21</p>
          </div>
          <p class="weather-forecast-name">Thunderstorm</p>
          <p class="weather-day">Monday, 17 may</p>
        </div>
        <div class="forecast">
          <div>
            <img src="images/wind.png" alt="wind" />
            <p class="forecast-data">13 km/h</p>
            <p class="forecast-name">Wind</p>
          </div>
          <div>
            <img src="images/raindrop.png" alt="Humidity" />
            <p class="forecast-data">24%</p>
            <p class="forecast-name">Humidity</p>
          </div>
          <div>
            <img src="images/chance-of-rain.png" alt="sun" />
            <p class="forecast-data">87%</p>
            <p class="forecast-name">chance of rain</p>
          </div>
        </div>
      </main>
      <section>
        <div class="forecast-menu">
          <p>Today</p>
          <a href="weather-detail.html">7 days ></a>
        </div>
        <div class="forecast-menu container-cards">
          <div class="forecast-card">
            <p>23°</p>
            <img src="images/rainy-icon.png" alt="rain" />
            <p>10:00</p>
          </div>
          <div class="forecast-card">
            <p>21°</p>
            <img src="images/thunder.png" alt="thunder" />
            <p>11:00</p>
          </div>
          <div class="forecast-card">
            <p>22°</p>
            <img src="images/rainy-icon.png" alt="rain" />
            <p>12:00</p>
          </div>
          <div class="forecast-card">
            <p>19°</p>
            <img src="images/heigth-slow.png" alt="slow" />
            <p>01:00</p>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
