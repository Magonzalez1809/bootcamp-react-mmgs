<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="flex.css" />
    <title>Document</title>
  </head>
  <body>
    <h1>Diplay flex</h1>
    <p>Flex direction default is row, and justify content flex start</p>
    <div id="box-container">
      <div id="box-1"></div>
      <div id="box-2"></div>
    </div>

    <h2>Flex direction column</h2>
    <div class="flex-direction-columns">
      <div id="box-1"></div>
      <div id="box-2"></div>
    </div>

    <h2>Flex direction row reverse</h2>
    <div class="flex-direction-row-reverse">
      <div id="box-1"></div>
      <div id="box-2"></div>
    </div>

    <h2>Flex direction column reverse</h2>
    <div class="flex-direction-column-reverse">
      <div id="box-1"></div>
      <div id="box-2"></div>
    </div>

    <h2>Justify content, flex end in row</h2>
    <div class="flex-end">
      <div id="box-1"></div>
      <div id="box-2"></div>
    </div>

    <h2>Justify content, flex end in column</h2>
    <div class="flex-end-column">
      <div id="box-1"></div>
      <div id="box-2"></div>
    </div>

    <h2>Aling items, flex end in row</h2>
    <div class="flex-end-aling-items">
      <div id="box-1"></div>
      <div id="box-2"></div>
    </div>

    <h2>Aling items, flex end in column</h2>
    <div class="flex-end-column-alig-items">
      <div id="box-1"></div>
      <div id="box-2"></div>
    </div>
  </body>
</html>
